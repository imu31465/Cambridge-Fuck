<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cambridge Fuck</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <main class="popup">
    <header class="header">
      <h1>Cambridge Fuck</h1>
      <p id="build" class="build">Build -</p>
    </header>

    <p id="statusLine" class="srOnly" aria-live="polite">Connecting...</p>

    <section class="controls">
      <button id="scanBtn" type="button">Re-scan</button>
      <button id="answerNowBtn" type="button">Answer Now</button>
      <button id="toggleAutoAnswerBtn" type="button">Auto Answer: OFF</button>
      <button id="toggleAutoActivityBtn" type="button">Auto Activity: OFF</button>
      <button id="toggleAutoNextBtn" type="button">Auto Next: OFF</button>
      <button id="toggleAutoWrongStopBtn" type="button">Auto Wrong Stop: OFF</button>
      <div class="utilityActions">
        <button id="refreshBtn" type="button">Refresh</button>
        <button id="sendDebugReportBtn" type="button">Bug Report</button>
      </div>
    </section>

    <section class="settingRow">
      <div class="settingBox">
        <label for="languageSelect" class="speedLabel">
          <span id="languageLabelText">Language</span>
        </label>
        <select id="languageSelect" class="languageSelect">
          <option value="auto">Auto</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="zh">中文</option>
        </select>
      </div>
      <div class="settingBox">
        <label for="speedLevelRange" class="speedLabel">
          <span id="speedLabelText">Speed</span>
          <span id="speedLevelValue" class="speedValue">L3</span>
        </label>
        <input id="speedLevelRange" type="range" min="1" max="5" step="1" value="3" />
      </div>
    </section>

    <section class="settingRow">
      <div class="settingBox webhookBox">
        <label for="webhookPassword" class="speedLabel">
          <span id="webhookLabelText">Webhook</span>
          <span id="webhookStatus" class="webhookStatus">Locked</span>
        </label>
        <div class="webhookRow">
          <input id="webhookPassword" type="password" autocomplete="off" />
          <button id="webhookUnlockBtn" type="button">Unlock</button>
        </div>
      </div>
    </section>

    <section class="logs" id="activitySection">
      <div class="logsHeader">
        <h2 id="activityHeader">Activity</h2>
        <div class="logsHeaderControls">
          <div class="tabs" role="tablist" aria-label="View tabs">
            <button id="tabLogsBtn" class="tab is-active" type="button" role="tab" aria-selected="true">
              Logs
            </button>
            <button id="tabQaBtn" class="tab" type="button" role="tab" aria-selected="false">
              Q&A
            </button>
          </div>
          <button id="activityToggleBtn" class="activityToggle" type="button" aria-expanded="false" aria-controls="logsPanel">
            ▸
          </button>
        </div>
      </div>

      <div id="logsPanel" class="panel is-active" role="tabpanel">
        <div id="logsArea" class="listView"></div>
      </div>
      <div id="qaPanel" class="panel" role="tabpanel" aria-hidden="true">
        <div id="qaArea" class="listView"></div>
      </div>
    </section>
  </main>

  <script src="content/i18n.js"></script>
  <script src="popup.js"></script>
</body>

</html>
